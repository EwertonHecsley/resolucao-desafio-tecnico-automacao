# Configuração standalone do ruff (quando não via pyproject.toml)

target-version = "py312"
line-length = 100

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[lint.per-file-ignores]
"tests/*" = [
    "ARG001",   # unused arguments in tests
    "S101",     # assert used in tests
]

[lint.isort]
known-first-party = ["app", "domain", "adapters", "services"]

[lint.pylint]
max-args = 7
max-returns = 6
max-branches = 12
max-statements = 50